# HTTP → HTTPS 重定向（保留 ACME challenge 路径以便续签）
# HTTP → HTTPS redirect (keep ACME challenge path for certificate renewal)
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 健康检查必须留在 80 明文：compose 的 wget 不带证书，跟随 301 到 HTTPS 会因自签证书失败。
    # Keep healthcheck on plain HTTP: compose wget cannot validate a self-signed cert after a 301.
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主服务 / Main HTTPS server
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # 现代 TLS 配置：只启用 TLS 1.2/1.3 与强加密套件
    # Modern TLS: only TLS 1.2/1.3 and strong ciphers.
    ssl_protocols              TLSv1.2 TLSv1.3;
    ssl_ciphers                ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers  off;
    ssl_session_cache          shared:SSL:10m;
    ssl_session_timeout        10m;

    # HSTS：告知浏览器强制使用 HTTPS（自签证书测试阶段请临时注释此行，避免浏览器长期锁定）
    # HSTS: force HTTPS in browsers (comment out during self-signed testing to avoid long-term lock-in).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 50m;

    # 哈希命名的静态资源：内容不可变，可长缓存；gzip 由 http 块全局开启
    # / Hash-named assets are immutable and can be cached long-term; gzip is global.
    location /assets/ {
        proxy_pass http://axiom:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 静态资源：由 Spring Boot 从 jar 内提供，全部反向代理转发
    # Static assets are served from the jar by Spring Boot; proxy everything.
    location / {
        proxy_pass http://axiom:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # SSE 流式分析：必须关闭缓冲并延长读超时，否则前端收不到实时事件
    # SSE streaming: buffering must be off and read timeout raised, otherwise real-time events never reach the client.
    location /api/chat {
        proxy_pass http://axiom:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering                    off;
        proxy_cache                        off;
        chunked_transfer_encoding          on;
        proxy_read_timeout                 300s;
        proxy_send_timeout                 300s;
    }

    # Nginx 自身健康端点，供 compose healthcheck 使用
    # Nginx self health endpoint for compose healthcheck.
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
