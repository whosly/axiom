user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式带请求耗时，便于排查 SSE 长连接问题
    # Log format includes request time to help diagnose long-lived SSE connections.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # 客户端请求体上限，与后端 multipart 50MB 对齐
    # Client body limit aligned with backend multipart 50MB.
    client_max_body_size 50m;

    # 隐藏版本号，减少信息泄露 / Hide version to reduce information disclosure.
    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
}
